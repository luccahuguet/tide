[package]
name = "tide_std_stub"
version = "0.0.0"
edition = "2024"
publish = false
description = "Conformance rustc oracle: a compile-time fixture of Tide std, injected as std (throwaway)"

[dependencies]
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std", "event", "net"] }
# Production's net module (included below) and its pins (research/42 §8).
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "=0.17.14" }
webpki-roots = { version = "=1.0.12" }
httparse = { version = "=1.10.1", default-features = false }
url = { version = "=2.5.8" }
idna_adapter = { version = "=1.0.0" }
# Tide's std's macros, which the included crate-root items re-export.
tide-macros = { path = "../../../crates/tide-macros" }
# #[trusted_pure], which tide-macros does not define.
conformance_macros = { path = "../macros" }

# Its own workspace, so no parent manifest is consulted.
[workspace]
