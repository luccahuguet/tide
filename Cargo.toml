[workspace]
members = ["crates/tide-admit", "crates/tide-conformance", "crates/tide-demo", "crates/tide-macros", "crates/tide-std"]
# Prototypes, oracles, and records keep their own manifests and toolchains.
exclude = ["archive", "conformance", "spikes", "trials"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"
