[package]
name = "tide-macros"
version = "0.0.0"
description = "Tide's toolchain macros: main, test, sinks, and the Error derive"
edition.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "visit"] }
