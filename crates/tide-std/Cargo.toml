[package]
name = "tide_std"
version = "0.0.0"
description = "Tide's std, injected as std by the admission driver (D18): the entry, sinks, Pure, capability types, and the JSON codec"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# D3: one software libm on every target, including when features are unified.
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
tide-macros = { path = "../tide-macros" }
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std", "event", "net", "rand"] }
# Net::get (research/42 §8, AP-DEPENDENCY-001): TLS with ring and compiled-in roots, HTTP/1.1
# heads, and the WHATWG URL parser; idna_adapter is named only to pin idna's ASCII-only stub.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = { version = "=0.17.14" }
webpki-roots = { version = "=1.0.12" }
httparse = { version = "=1.10.1", default-features = false }
url = { version = "=2.5.8" }
idna_adapter = { version = "=1.0.0" }
