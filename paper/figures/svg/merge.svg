<svg xmlns="http://www.w3.org/2000/svg" width="459" height="130.2" viewBox="0 0 459 130.2" font-family="Libertinus Serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#222222"/></marker></defs><rect x="1" y="1" width="103.75" height="74" rx="2" fill="white" stroke="#222222" stroke-width="0.6"/><text x="6" y="13" font-size="8.5" font-weight="bold" fill="#222222">Frozen candidate</text><text x="6" y="24.6" font-size="7.5" fill="#222222">The change, frozen for</text><text x="6" y="33.98" font-size="7.5" fill="#222222">review; every reviewer is</text><text x="6" y="43.35" font-size="7.5" fill="#222222">read-only.</text><rect x="118.75" y="1" width="103.75" height="74" rx="2" fill="white" stroke="#222222" stroke-width="0.6"/><text x="123.75" y="13" font-size="8.5" font-weight="bold" fill="#222222">Codex pass</text><text x="123.75" y="24.6" font-size="7.5" fill="#222222"><tspan font-family="DejaVu Sans Mono" font-size="6.6">gpt-6.1-sol</tspan>, effort high.</text><text x="123.75" y="33.98" font-size="7.5" fill="#222222">The author fixes or rebuts</text><text x="123.75" y="43.35" font-size="7.5" fill="#222222">each finding; the supervisor</text><text x="123.75" y="52.73" font-size="7.5" fill="#222222">re-checks until it reports the</text><text x="123.75" y="62.1" font-size="7.5" fill="#222222">tree clean.</text><line x1="105.75" y1="38" x2="117.75" y2="38" stroke="#222222" stroke-width="0.6" marker-end="url(#arrow)"/><rect x="236.5" y="1" width="103.75" height="74" rx="2" fill="white" stroke="#222222" stroke-width="0.6"/><text x="241.5" y="13" font-size="8.5" font-weight="bold" fill="#222222">Opus review</text><text x="241.5" y="24.6" font-size="7.5" fill="#222222">On the Codex-clean tree. The</text><text x="241.5" y="33.98" font-size="7.5" fill="#222222">author fixes or rebuts; the</text><text x="241.5" y="43.35" font-size="7.5" fill="#222222">reviewer that found each</text><text x="241.5" y="52.73" font-size="7.5" fill="#222222">finding re-checks only its fix.</text><line x1="223.5" y1="38" x2="235.5" y2="38" stroke="#222222" stroke-width="0.6" marker-end="url(#arrow)"/><rect x="354.25" y="1" width="103.75" height="74" rx="2" fill="#dcecf7" stroke="#222222" stroke-width="0.6"/><text x="359.25" y="13" font-size="8.5" font-weight="bold" fill="#222222">Lands on main</text><text x="359.25" y="24.6" font-size="7.5" fill="#222222">The human maintainer</text><text x="359.25" y="33.98" font-size="7.5" fill="#222222">remains final merge</text><text x="359.25" y="43.35" font-size="7.5" fill="#222222">authority.</text><line x1="341.25" y1="38" x2="353.25" y2="38" stroke="#222222" stroke-width="0.6" marker-end="url(#arrow)"/><text x="0" y="90" font-size="8" font-weight="bold" fill="#222222">Exceptions</text><text x="0" y="102" font-size="7.5" fill="#222222">–</text><text x="10" y="102" font-size="7.5" fill="#222222">Provider refuses the Codex pass: an Opus stand-in review takes its place and records the refusal.</text><text x="0" y="113.4" font-size="7.5" fill="#222222">–</text><text x="10" y="113.4" font-size="7.5" fill="#222222">Planning-only changes skip the Codex pass.</text><text x="0" y="124.8" font-size="7.5" fill="#222222">–</text><text x="10" y="124.8" font-size="7.5" fill="#222222">A protocol-import update that only regenerates files from a pinned source, with its check passing, skips both reviews.</text></svg>
