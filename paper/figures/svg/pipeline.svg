<svg xmlns="http://www.w3.org/2000/svg" width="459" height="116" viewBox="0 0 459 116" font-family="Libertinus Serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#222222"/></marker></defs><text x="0" y="10" font-size="7.5" fill="#666666">In: crate source</text><text x="459" y="10" font-size="7.5" text-anchor="end" fill="#666666">Out: manifest and trace</text><rect x="1" y="18" width="103.75" height="96" rx="2" fill="white" stroke="#222222" stroke-width="0.6"/><text x="6" y="30" font-size="8.5" font-weight="bold" fill="#222222">Admission</text><text x="6" y="41.6" font-size="7.5" fill="#222222"><tspan font-family="DejaVu Sans Mono" font-size="6.6">tide-admit</tspan> runs inside a</text><text x="6" y="50.98" font-size="7.5" fill="#222222">pinned rustc and checks the</text><text x="6" y="60.35" font-size="7.5" fill="#222222">subset, authority and <tspan font-family="DejaVu Sans Mono" font-size="6.6">Pure</tspan>.</text><text x="6" y="69.72" font-size="7.5" fill="#222222">A rejected crate gets no</text><text x="6" y="79.1" font-size="7.5" fill="#222222">artifact.</text><rect x="118.75" y="18" width="103.75" height="96" rx="2" fill="#ececec" stroke="#222222" stroke-width="0.6"/><text x="123.75" y="30" font-size="8.5" font-weight="bold" fill="#222222">RUN-3 sandbox</text><text x="123.75" y="41.6" font-size="7.5" fill="#222222">The test runs as a child</text><text x="123.75" y="50.98" font-size="7.5" fill="#222222">process under Landlock and</text><text x="123.75" y="60.35" font-size="7.5" fill="#222222">seccomp. The driver prints</text><text x="123.75" y="69.72" font-size="7.5" fill="#222222">the level first: <tspan font-family="DejaVu Sans Mono" font-size="6.6">full</tspan>, or</text><text x="123.75" y="79.1" font-size="7.5" fill="#222222"><tspan font-family="DejaVu Sans Mono" font-size="6.6">partial, not</tspan></text><text x="123.75" y="88.48" font-size="7.5" fill="#222222"><tspan font-family="DejaVu Sans Mono" font-size="6.6">enforced</tspan>.</text><line x1="105.75" y1="66" x2="117.75" y2="66" stroke="#222222" stroke-width="0.6" marker-end="url(#arrow)"/><rect x="236.5" y="18" width="103.75" height="96" rx="2" fill="white" stroke="#222222" stroke-width="0.6"/><text x="241.5" y="30" font-size="8.5" font-weight="bold" fill="#222222">Simulator</text><text x="241.5" y="41.6" font-size="7.5" fill="#222222">Under <tspan font-family="DejaVu Sans Mono" font-size="6.6">Root::sim(seed)</tspan></text><text x="241.5" y="50.98" font-size="7.5" fill="#222222">the seed decides the</text><text x="241.5" y="60.35" font-size="7.5" fill="#222222">schedule, and virtual time</text><text x="241.5" y="69.72" font-size="7.5" fill="#222222">advances only when every</text><text x="241.5" y="79.1" font-size="7.5" fill="#222222">task is blocked.</text><line x1="223.5" y1="66" x2="235.5" y2="66" stroke="#222222" stroke-width="0.6" marker-end="url(#arrow)"/><rect x="354.25" y="18" width="103.75" height="96" rx="2" fill="white" stroke="#222222" stroke-width="0.6"/><text x="359.25" y="30" font-size="8.5" font-weight="bold" fill="#222222">Replay</text><text x="359.25" y="41.6" font-size="7.5" fill="#222222">The manifest records the</text><text x="359.25" y="50.98" font-size="7.5" fill="#222222">seed, source hashes, build</text><text x="359.25" y="60.35" font-size="7.5" fill="#222222">identity and inputs. Replay</text><text x="359.25" y="69.72" font-size="7.5" fill="#222222">refuses a mismatched</text><text x="359.25" y="79.1" font-size="7.5" fill="#222222">identity.</text><line x1="341.25" y1="66" x2="353.25" y2="66" stroke="#222222" stroke-width="0.6" marker-end="url(#arrow)"/></svg>
