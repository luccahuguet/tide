<svg xmlns="http://www.w3.org/2000/svg" width="459" height="152.6" viewBox="0 0 459 152.6" font-family="Libertinus Serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#222222"/></marker></defs><text x="70" y="10" font-size="8.5" font-weight="bold" fill="#222222">The v0 simulator models</text><text x="268.5" y="10" font-size="8.5" font-weight="bold" fill="#222222">It does not model</text><line x1="0" y1="18" x2="459" y2="18" stroke="#b8b8b8" stroke-width="0.4"/><text x="0" y="29" font-size="8" font-weight="bold" fill="#222222">Tasks</text><rect x="70" y="20" width="190.5" height="22.8" fill="#dcecf7"/><text x="73" y="29" font-size="7.5" fill="#222222">Scheduling of structured tasks, <tspan font-family="DejaVu Sans Mono" font-size="6.6">Shared</tspan> and channels,</text><text x="73" y="38.38" font-size="7.5" fill="#222222">chosen by the seed</text><rect x="268.5" y="20" width="190.5" height="22.8" fill="#ececec"/><text x="271.5" y="29" font-size="7.5" fill="#222222">CPU time: a slow computation never fires a deadline</text><line x1="0" y1="44.8" x2="459" y2="44.8" stroke="#b8b8b8" stroke-width="0.4"/><text x="0" y="55.8" font-size="8" font-weight="bold" fill="#222222">Clock</text><rect x="70" y="46.8" width="190.5" height="13.4" fill="#dcecf7"/><text x="73" y="55.8" font-size="7.5" fill="#222222">Virtual time for the clock, sleeps and deadlines</text><rect x="268.5" y="46.8" width="190.5" height="13.4" fill="#ececec"/><text x="271.5" y="55.8" font-size="7.5" fill="#222222">Memory exhaustion, stack depth, parallel speed-up</text><line x1="0" y1="62.2" x2="459" y2="62.2" stroke="#b8b8b8" stroke-width="0.4"/><text x="0" y="73.2" font-size="8" font-weight="bold" fill="#222222">Files</text><rect x="70" y="64.2" width="190.5" height="13.4" fill="#dcecf7"/><text x="73" y="73.2" font-size="7.5" fill="#222222">Files, each call with a seed-drawn latency</text><rect x="268.5" y="64.2" width="190.5" height="13.4" fill="#ececec"/><text x="271.5" y="73.2" font-size="7.5" fill="#222222">Disk faults, crashes, partial effects</text><line x1="0" y1="79.6" x2="459" y2="79.6" stroke="#b8b8b8" stroke-width="0.4"/><text x="0" y="90.6" font-size="8" font-weight="bold" fill="#222222">Network</text><rect x="70" y="81.6" width="190.5" height="22.8" fill="#dcecf7"/><text x="73" y="90.6" font-size="7.5" fill="#222222">TCP on the local host; <tspan font-family="DejaVu Sans Mono" font-size="6.6">Net::get</tspan> against declared peers;</text><text x="73" y="99.98" font-size="7.5" fill="#222222"><tspan font-family="DejaVu Sans Mono" font-size="6.6">Net::resolve</tspan></text><rect x="268.5" y="81.6" width="190.5" height="22.8" fill="#ececec"/><text x="271.5" y="90.6" font-size="7.5" fill="#222222">Other hosts, UDP, TLS certificate validation, HTTP wire</text><text x="271.5" y="99.98" font-size="7.5" fill="#222222">parsing</text><line x1="0" y1="106.4" x2="459" y2="106.4" stroke="#b8b8b8" stroke-width="0.4"/><text x="0" y="117.4" font-size="8" font-weight="bold" fill="#222222">Processes</text><rect x="70" y="108.4" width="190.5" height="13.4" fill="#dcecf7"/><text x="73" y="117.4" font-size="7.5" fill="#222222">Child processes as declared models</text><rect x="268.5" y="108.4" width="190.5" height="13.4" fill="#ececec"/><text x="271.5" y="117.4" font-size="7.5" fill="#222222">Signals, real child processes</text><line x1="0" y1="123.8" x2="459" y2="123.8" stroke="#b8b8b8" stroke-width="0.4"/><text x="0" y="134.8" font-size="8" font-weight="bold" fill="#222222">Environment</text><rect x="70" y="125.8" width="190.5" height="22.8" fill="#dcecf7"/><text x="73" y="134.8" font-size="7.5" fill="#222222">Arguments, environment variables, standard input, sink</text><text x="73" y="144.17" font-size="7.5" fill="#222222">output; <tspan font-family="DejaVu Sans Mono" font-size="6.6">Rand</tspan> draws from the seed</text><rect x="268.5" y="125.8" width="190.5" height="22.8" fill="#ececec"/><text x="271.5" y="134.8" font-size="7.5" fill="#222222">Fault injection</text></svg>
