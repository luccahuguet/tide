[package]
name = "oracle_macros"
version = "0.0.0"
edition = "2024"
publish = false
description = "E1-dialect rustc oracle: #[test] and #[sim_test] shims and a thiserror-like derive(Error) (throwaway)"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }
